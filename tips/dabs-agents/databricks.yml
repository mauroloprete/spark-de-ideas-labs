bundle:
  name: dabs-agents-lab

sync:
  include:
    - "src/**/*.py"
    - "app/**"
  exclude:
    - "**/__pycache__"

# --- Variables ---

variables:
  environment:
    description: "Nombre del ambiente"
    default: dev

  catalog:
    description: "Catalogo de Unity Catalog"
    default: dev_bronze

  schema:
    description: "Schema para los recursos del lab"
    default: labs

  vs_endpoint:
    description: "Vector Search endpoint (debe existir)"
    default: vs-endpoint

# --- Recursos ---

resources:
  # Experiment de MLflow para tracking
  experiments:
    agent_experiment:
      name: /Users/${workspace.current_user.userName}/dabs-agents-lab

  # Serving endpoint con AI Gateway (se crea via CLI, bundle lo bindea despues)
  # model_serving_endpoints:
  #   agent_endpoint:
  #     name: soporte-bot-${var.environment}
  #     config:
  #       served_entities:
  #         - entity_name: ${var.catalog}.${var.schema}.soporte_bot
  #           entity_version: "3"
  #           workload_size: Small
  #           scale_to_zero_enabled: true
  #     ai_gateway:
  #       rate_limits:
  #         - key: user
  #           renewal_period: minute
  #           calls: 20

  # Lakebase — memoria persistente del agente
  postgres_projects:
    agent_memory:
      project_id: soporte-bot-memory
      display_name: "SoporteBot Memory Store"
      pg_version: 17

  postgres_branches:
    dev_branch:
      parent: ${resources.postgres_projects.agent_memory.id}
      branch_id: dev-lab
      no_expiry: true

  # Databricks App — Chat UI (se habilita despues del endpoint)
  # apps:
  #   chat_ui:
  #     name: soporte-bot-chat-${var.environment}
  #     source_code_path: ./app
  #     description: "SoporteBot — Chat UI para soporte tecnico"
  #     resources:
  #       - name: serving-endpoint
  #         serving_endpoint:
  #           name: ${resources.model_serving_endpoints.agent_endpoint.name}
  #           permission: CAN_QUERY

  # Job de setup: crea datos de ejemplo y registra el modelo
  jobs:
    setup_lab:
      name: "[${var.environment}] dabs_agents_setup"
      tasks:
        - task_key: setup_data
          notebook_task:
            notebook_path: ./src/00_setup_data.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: register_agent
          depends_on:
            - task_key: setup_data
          notebook_task:
            notebook_path: ./src/01_agent.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

    # Job de refresh del vector index
    refresh_index:
      name: "[${var.environment}] dabs_agents_refresh_index"
      tasks:
        - task_key: refresh
          notebook_task:
            notebook_path: ./src/02_refresh_index.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Montevideo"

# --- Targets ---

targets:
  dev:
    mode: development
    default: true
    presets:
      tags:
        environment: dev
        lab: dabs-agents

  prod:
    mode: production
    workspace:
      host: https://adb-7405619081216020.0.azuredatabricks.net
    variables:
      environment: prod
    run_as:
      user_name: mauroloprete@mauroloprete558.onmicrosoft.com
    permissions:
      - user_name: mauroloprete@mauroloprete558.onmicrosoft.com
        level: CAN_MANAGE
    presets:
      name_prefix: ""
      tags:
        environment: prod
        lab: dabs-agents
